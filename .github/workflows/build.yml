name: Build App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: '3.14'

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: Build
          run: pyinstaller --noconfirm --clean --onedir --windowed --icon="assets/icon.ico" --add-data="assets;assets" --exclude-module=setuptools --name="FunkinSheet Studio" Main.py

        - name: Upload artifact
          uses: actions/upload-artifact@v7
          with:
            name: FunkinSheetStudio-Windows
            path: dist/