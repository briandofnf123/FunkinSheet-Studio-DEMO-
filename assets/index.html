<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpriteSheet Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/maxrects-packer@2.7.3/dist/maxrects-packer.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      body {
        background-color: #13131a;
        color: #e2e8f0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
      }
      .glass-panel {
        background: rgba(30, 30, 46, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        backdrop-filter: blur(10px);
        background-color: rgba(30, 30, 46, 0.85);
      }
      .btn-primary {
        background: linear-gradient(135deg, #f92d7a, #6c5ce7);
        transition: all 0.2s ease;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -10px #f92d7a;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        transition: all 0.2s ease;
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .btn-icon {
        background: linear-gradient(135deg, #10b981, #3b82f6);
        transition: all 0.2s ease;
      }
      .btn-icon:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -10px #10b981;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #13131a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #4a5568;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #718096;
      }

      .dropzone-active {
        border-color: #f92d7a !important;
        background: rgba(249, 45, 122, 0.1) !important;
      }

      #toast-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .toast {
        background: #2d3748;
        border-left: 4px solid #f92d7a;
        padding: 12px 20px;
        border-radius: 6px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        animation:
          slideIn 0.3s ease forwards,
          fadeOut 0.3s ease 2.7s forwards;
        color: white;
      }
      @keyframes slideIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @keyframes fadeOut {
        from {
          transform: translateX(0);
          opacity: 1;
        }
        to {
          transform: translateX(100%);
          opacity: 0;
        }
      }
      select {
        background-color: #1f2937;
        color: #e2e8f0;
        border: 1px solid #4b5563;
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        outline: none;
        cursor: pointer;
      }
      select:focus {
        border-color: #f92d7a;
      }
    </style>
  </head>
  <body class="min-h-screen p-4 md:p-8 relative">
    <div class="absolute top-4 right-4 md:top-8 md:right-8 z-50">
      <select
        id="langSelect"
        onchange="changeLanguage(this.value)"
        class="bg-gray-800 border border-gray-600 text-white text-sm rounded-lg focus:border-pink-500 block w-full p-2.5 outline-none cursor-pointer"
      >
        <option value="br">Português (BR)</option>
        <option value="en" selected>English</option>
        <option value="es">Español</option>
        <option value="id">Bahasa Indonesia</option>
      </select>
    </div>

    <div id="toast-container"></div>

    <div class="max-w-5xl mx-auto space-y-6">
      <header class="text-center py-6 mt-8 md:mt-0">
        <h1
          class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500 drop-shadow-lg flex items-center justify-center gap-3"
        >
          <i class="fa-solid fa-cubes text-pink-500"></i> SpriteSheet Studio
        </h1>
        <p id="descApp" class="text-gray-400 mt-2">
          Create Spritesheets, XMLs, and Icon Strips optimized for any game
          engine.
        </p>
      </header>

      <div class="flex justify-center gap-4 mb-4">
        <button
          id="tab-sprite"
          onclick="setMode('sprite')"
          class="px-6 py-2.5 rounded-full font-bold transition-all bg-pink-600 text-white shadow-lg shadow-pink-500/30 flex items-center gap-2"
        >
          <i class="fa-solid fa-border-all"></i>
          <span id="lblTabSprite">Create Spritesheet</span>
        </button>
        <button
          id="tab-icon"
          onclick="setMode('icon')"
          class="px-6 py-2.5 rounded-full font-bold transition-all bg-gray-800 text-gray-400 hover:bg-gray-700 flex items-center gap-2"
        >
          <i class="fa-solid fa-table-columns"></i>
          <span id="lblTabIcon">Icon Strip</span>
        </button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="space-y-6">
          <div class="glass-panel p-6 shadow-xl">
            <h2
              id="titleConfig"
              class="text-xl font-bold mb-4 flex items-center gap-2"
            >
              <i class="fa-solid fa-sliders text-pink-500"></i>
              Settings
            </h2>
            <div class="space-y-4">
              <div>
                <label
                  id="lblSheetName"
                  class="block text-sm font-medium text-gray-400 mb-1"
                  >File Name</label
                >
                <input
                  type="text"
                  id="sheetName"
                  value="my_character"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-pink-500 transition"
                  placeholder="Ex: my_character"
                />
              </div>
              <div id="packing-alg-group">
                <label
                  id="lblPackingAlg"
                  class="block text-sm font-medium text-gray-400 mb-1"
                  >Packing Algorithm</label
                >
                <select
                  id="packingAlg"
                  class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-pink-500"
                >
                  <option value="maxrects">MaxRects (Efficient)</option>
                  <option value="shelf">Shelf (Simple, preserves order)</option>
                </select>
              </div>
            </div>
          </div>

          <div
            class="glass-panel p-6 shadow-xl text-center flex flex-col gap-3"
          >
            <h2
              id="titleExport"
              class="text-xl font-bold mb-2 text-left flex items-center gap-2"
            >
              <i class="fa-solid fa-file-export text-purple-400"></i>
              Export Files
            </h2>

            <div id="export-sprite-panel" class="block">
              <button
                onclick="exportSprites()"
                class="btn-primary w-full py-3 rounded-lg font-bold text-white shadow-lg flex justify-center items-center gap-2"
              >
                <i class="fa-solid fa-file-zipper text-lg"></i>
                <span id="btnExportZip">Generate ZIP (PNG + XML)</span>
              </button>
              <p id="descSprite" class="text-xs text-gray-400 mt-2 text-left">
                Generates the packed spritesheet and Sparrow V2 XML.
              </p>
            </div>

            <div id="export-icon-panel" class="hidden">
              <button
                onclick="exportIcon()"
                class="btn-icon w-full py-3 rounded-lg font-bold text-white shadow-lg flex justify-center items-center gap-2"
              >
                <i class="fa-solid fa-file-image text-lg"></i>
                <span id="btnExportIcon">Generate Icon Strip (PNG)</span>
              </button>
              <p id="descIcon" class="text-xs text-gray-400 mt-2 text-left">
                Aligns images horizontally into an Icon Strip PNG.
              </p>
            </div>
          </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
          <div class="glass-panel p-1">
            <label
              id="dropzone"
              for="fileInput"
              class="block w-full border-2 border-dashed border-gray-600 hover:border-pink-500 hover:bg-gray-800/50 rounded-xl p-8 text-center cursor-pointer transition-all duration-200"
            >
              <div class="flex flex-col items-center justify-center space-y-3">
                <div
                  class="bg-gray-800/80 p-4 rounded-full text-pink-500 shadow-inner"
                >
                  <i class="fa-solid fa-cloud-arrow-up text-3xl"></i>
                </div>
                <div>
                  <p id="dropTitle" class="text-lg font-semibold text-white">
                    Click or Drag your PNG images
                  </p>
                  <p id="dropDesc" class="text-sm text-gray-400">
                    You can select multiple frames at once!
                  </p>
                </div>
              </div>
              <input
                type="file"
                id="fileInput"
                multiple
                accept="image/png"
                class="hidden"
                onchange="handleFileInput(event)"
              />
            </label>
          </div>

          <div class="glass-panel p-6 shadow-xl flex flex-col max-h-[600px]">
            <div class="flex justify-between items-center mb-4">
              <h2 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-pink-500"></i>
                <span id="titleFrames">My Frames</span> (<span id="frameCount"
                  >0</span
                >)
              </h2>
              <div class="flex gap-2">
                <button
                  id="btnSort"
                  onclick="sortFrames()"
                  class="text-sm text-blue-400 hover:text-blue-300 transition px-2 flex items-center gap-1.5"
                >
                  <i class="fa-solid fa-arrow-down-a-z"></i> Sort by Name
                </button>
                <button
                  id="btnClear"
                  onclick="clearAll()"
                  class="text-sm text-red-400 hover:text-red-300 transition px-2 border-l border-gray-600 flex items-center gap-1.5"
                >
                  <i class="fa-solid fa-trash-can"></i> Clear All
                </button>
              </div>
            </div>

            <div
              id="frameList"
              class="flex-1 overflow-y-auto space-y-3 pr-2 min-h-[200px]"
            ></div>

            <div id="emptyState" class="text-center text-gray-500 my-10">
              <i
                class="fa-regular fa-images text-5xl text-gray-600 mb-3 block"
              ></i>
              <p id="emptyTitle" class="font-medium">No images added yet.</p>
              <p id="emptyDesc" class="text-sm">
                Frames will appear here as a list.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

      function t(key) {
        return translations[currentLang][key] || key;
      }

      function changeLanguage(lang) {
        currentLang = lang;
        document.documentElement.lang = lang;
        document.getElementById("descApp").innerText = t("descApp");
        document.getElementById("titleConfig").innerHTML = `
          <i class="fa-solid fa-sliders text-pink-500"></i> ${t("titleConfig")}`;
        document.getElementById("lblSheetName").innerText = t("lblSheetName");
        document.getElementById("lblPackingAlg").innerText = t("lblPackingAlg");
        document.getElementById("titleExport").innerHTML = `
          <i class="fa-solid fa-file-export text-purple-400"></i> ${t("titleExport")}`;
        document.getElementById("lblTabSprite").innerText = t("lblTabSprite");
        document.getElementById("lblTabIcon").innerText = t("lblTabIcon");
        document.getElementById("btnExportZip").innerText = t("btnExportZip");
        document.getElementById("descSprite").innerText = t("descSprite");
        document.getElementById("btnExportIcon").innerText = t("btnExportIcon");
        document.getElementById("descIcon").innerText = t("descIcon");
        document.getElementById("dropTitle").innerText = t("dropTitle");
        document.getElementById("dropDesc").innerText = t("dropDesc");
        document.getElementById("titleFrames").innerText = t("titleFrames");
        document.getElementById("btnSort").innerHTML = `
          <i class="fa-solid fa-arrow-down-a-z"></i> ${t("btnSort")}`;
        document.getElementById("btnClear").innerHTML = `
          <i class="fa-solid fa-trash-can"></i> ${t("btnClear")}`;
        document.getElementById("emptyTitle").innerText = t("emptyTitle");
        document.getElementById("emptyDesc").innerText = t("emptyDesc");
        renderFrames();
      }

      function detectAndSetLanguage() {
        const browserLang = navigator.language || navigator.userLanguage;
        let detectedLang = "en";
        if (browserLang) {
          const langCode = browserLang.split("-")[0].toLowerCase();
          if (langCode === "pt") {
            const full = browserLang.toLowerCase();
            detectedLang = full === "pt-br" || full === "pt_br" ? "br" : "en";
          } else if (langCode === "es") detectedLang = "es";
          else if (langCode === "id") detectedLang = "id";
          else if (langCode === "en") detectedLang = "en";
        }
        document.getElementById("langSelect").value = detectedLang;
        changeLanguage(detectedLang);
      }

      let currentMode = "sprite";
      let frames = [];
      let idCounter = 0;

      function showToast(message) {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          if (toast.parentElement) toast.remove();
        }, 3000);
      }

      function setMode(mode) {
        currentMode = mode;
        const tabSprite = document.getElementById("tab-sprite");
        const tabIcon = document.getElementById("tab-icon");
        const panelSprite = document.getElementById("export-sprite-panel");
        const panelIcon = document.getElementById("export-icon-panel");
        const packingGroup = document.getElementById("packing-alg-group");

        if (mode === "sprite") {
          tabSprite.className =
            "px-6 py-2.5 rounded-full font-bold transition-all bg-pink-600 text-white shadow-lg shadow-pink-500/30 flex items-center gap-2";
          tabIcon.className =
            "px-6 py-2.5 rounded-full font-bold transition-all bg-gray-800 text-gray-400 hover:bg-gray-700 flex items-center gap-2";
          panelSprite.style.display = "block";
          panelIcon.style.display = "none";
          packingGroup.style.display = "block";
        } else {
          tabIcon.className =
            "px-6 py-2.5 rounded-full font-bold transition-all bg-pink-600 text-white shadow-lg shadow-pink-500/30 flex items-center gap-2";
          tabSprite.className =
            "px-6 py-2.5 rounded-full font-bold transition-all bg-gray-800 text-gray-400 hover:bg-gray-700 flex items-center gap-2";
          panelSprite.style.display = "none";
          panelIcon.style.display = "block";
          packingGroup.style.display = "none";
        }
        renderFrames();
      }

      function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.onerror = (e) => reject(e);
          reader.readAsDataURL(file);
        });
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = (e) => reject(e);
          img.src = src;
        });
      }

      async function processFiles(files) {
        const validFiles = Array.from(files).filter((file) =>
          file.type.match("image/png"),
        );
        if (validFiles.length === 0) {
          showToast(t("msgOnlyPng"));
          return;
        }

        let addedCount = 0;
        let failedFiles = [];
        showToast(t("msgLoading"));

        for (const file of validFiles) {
          try {
            const dataUrl = await readFileAsDataURL(file);
            const img = await loadImage(dataUrl);

            let guessName = file.name.replace(/\.[^/.]+$/, "");
            guessName = guessName.replace(/([_-]?)(\d+)$/, "");
            guessName = guessName.replace(/[_-]+$/, "");
            if (!guessName) guessName = "anim";

            frames.push({
              id: idCounter++,
              filename: file.name,
              animName: guessName,
              imgElement: img,
              width: img.width,
              height: img.height,
              dataUrl: dataUrl,
            });
            addedCount++;
          } catch (error) {
            console.error(`Error processing ${file.name}:`, error);
            failedFiles.push(file.name);
          }
        }

        if (failedFiles.length > 0) {
          showToast(`${t("msgLoadError")}${failedFiles.join(", ")}`);
        }
        if (addedCount > 0) {
          showToast(`${addedCount} ${t("msgAdded")}`);
          renderFrames();
        }
      }

      function renderFrames() {
        const list = document.getElementById("frameList");
        const emptyState = document.getElementById("emptyState");
        const count = document.getElementById("frameCount");

        count.textContent = frames.length;
        list.innerHTML = "";

        if (frames.length === 0) {
          emptyState.style.display = "block";
          return;
        }
        emptyState.style.display = "none";

        frames.forEach((frame, index) => {
          const item = document.createElement("div");
          item.className =
            "flex items-center gap-4 bg-gray-800/80 p-3 rounded-lg border border-gray-700 transition hover:border-gray-500";

          const thumbWrapper = document.createElement("div");
          thumbWrapper.className =
            "w-16 h-16 bg-gray-900 rounded border border-gray-600 flex items-center justify-center overflow-hidden flex-shrink-0 relative";
          thumbWrapper.style.backgroundImage =
            "linear-gradient(45deg, #1f2937 25%, transparent 25%), linear-gradient(-45deg, #1f2937 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1f2937 75%), linear-gradient(-45deg, transparent 75%, #1f2937 75%)";
          thumbWrapper.style.backgroundSize = "10px 10px";
          thumbWrapper.style.backgroundPosition =
            "0 0, 0 5px, 5px -5px, -5px 0px";

          const thumb = document.createElement("img");
          thumb.src = frame.dataUrl;
          thumb.className = "max-w-full max-h-full object-contain";
          thumb.alt = frame.filename;
          thumbWrapper.appendChild(thumb);

          const infoWrapper = document.createElement("div");
          infoWrapper.className = "flex-1 flex flex-col justify-center min-w-0";

          const filenameLabel = document.createElement("div");
          filenameLabel.className = "text-xs text-gray-500 truncate mb-1";
          filenameLabel.textContent =
            frame.filename + ` (${frame.width}x${frame.height})`;
          infoWrapper.appendChild(filenameLabel);

          if (currentMode === "sprite") {
            const nameInput = document.createElement("input");
            nameInput.type = "text";
            nameInput.value = frame.animName;
            nameInput.placeholder = t("inputPlace");
            nameInput.className =
              "w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white focus:outline-none focus:border-pink-500 transition";
            nameInput.oninput = (e) => {
              frame.animName = e.target.value.trim() || "anim";
            };
            infoWrapper.appendChild(nameInput);
          }

          const controlsWrapper = document.createElement("div");
          controlsWrapper.className = "flex items-center gap-1.5 flex-shrink-0";

          const btnUp = document.createElement("button");
          btnUp.className =
            "w-8 h-8 btn-secondary rounded flex items-center justify-center text-gray-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed";
          btnUp.disabled = index === 0;
          btnUp.innerHTML = '<i class="fa-solid fa-chevron-up text-xs"></i>';
          btnUp.onclick = () => moveFrame(index, -1);

          const btnDown = document.createElement("button");
          btnDown.className =
            "w-8 h-8 btn-secondary rounded flex items-center justify-center text-gray-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed";
          btnDown.disabled = index === frames.length - 1;
          btnDown.innerHTML =
            '<i class="fa-solid fa-chevron-down text-xs"></i>';
          btnDown.onclick = () => moveFrame(index, 1);

          const btnRemove = document.createElement("button");
          btnRemove.className =
            "w-8 h-8 btn-secondary rounded flex items-center justify-center hover:bg-red-500/20 text-red-400 hover:text-red-300";
          btnRemove.innerHTML = '<i class="fa-solid fa-trash-can text-xs"></i>';
          btnRemove.onclick = () => removeFrame(index);

          controlsWrapper.appendChild(btnUp);
          controlsWrapper.appendChild(btnDown);
          controlsWrapper.appendChild(btnRemove);

          item.appendChild(thumbWrapper);
          item.appendChild(infoWrapper);
          item.appendChild(controlsWrapper);

          list.appendChild(item);
        });
      }

      function moveFrame(index, dir) {
        if (dir === -1 && index > 0) {
          [frames[index], frames[index - 1]] = [
            frames[index - 1],
            frames[index],
          ];
          renderFrames();
        } else if (dir === 1 && index < frames.length - 1) {
          [frames[index], frames[index + 1]] = [
            frames[index + 1],
            frames[index],
          ];
          renderFrames();
        }
      }

      function removeFrame(index) {
        frames.splice(index, 1);
        renderFrames();
      }

      function clearAll() {
        if (confirm(t("msgConfirmClear"))) {
          frames = [];
          renderFrames();
          showToast(t("msgCleared"));
        }
      }

      function sortFrames() {
        frames.sort((a, b) => a.filename.localeCompare(b.filename));
        renderFrames();
        showToast(t("msgSorted"));
      }

      function exportIcon() {
        if (frames.length === 0) {
          showToast(t("msgNoFrames"));
          return;
        }

        const sheetName =
          document.getElementById("sheetName").value.trim() || "icon_strip";

        let totalWidth = 0;
        let maxHeight = 0;
        frames.forEach((f) => {
          totalWidth += f.width;
          if (f.height > maxHeight) maxHeight = f.height;
        });

        const canvas = document.createElement("canvas");
        canvas.width = totalWidth;
        canvas.height = maxHeight;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let currentX = 0;
        frames.forEach((f) => {
          ctx.drawImage(f.imgElement, currentX, 0);
          currentX += f.width;
        });

        canvas.toBlob((blob) => {
          if (!blob) return;
          const downloadLink = document.createElement("a");
          const url = URL.createObjectURL(blob);
          downloadLink.href = url;
          downloadLink.download = `${sheetName}.png`;
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
          setTimeout(() => URL.revokeObjectURL(url), 100);
          showToast(t("msgSuccess"));
        }, "image/png");
      }

      async function exportSprites() {
        if (frames.length === 0) {
          showToast(t("msgNoFrames"));
          return;
        }

        if (typeof JSZip === "undefined") {
          showToast("Error: JSZip not loaded.");
          return;
        }

        showToast(t("msgWait"));

        const sheetName =
          document.getElementById("sheetName").value.trim() || "spritesheet";
        const algorithm = document.getElementById("packingAlg").value;

        const frameData = frames.map((f, idx) => ({
          width: f.width,
          height: f.height,
          animName: f.animName || "anim",
          img: f.imgElement,
          index: idx,
        }));

        function packShelf(data) {
          const MAX_WIDTH = 4096;
          let currentX = 0,
            currentY = 0,
            rowHeight = 0,
            maxUsedWidth = 0;
          const placements = [];

          for (let i = 0; i < data.length; i++) {
            const item = data[i];
            if (currentX + item.width > MAX_WIDTH && currentX > 0) {
              currentX = 0;
              currentY += rowHeight;
              rowHeight = 0;
            }
            placements.push({
              img: item.img,
              x: currentX,
              y: currentY,
              w: item.width,
              h: item.height,
              animName: item.animName,
              idx: item.index,
            });
            currentX += item.width;
            if (currentX > maxUsedWidth) maxUsedWidth = currentX;
            if (item.height > rowHeight) rowHeight = item.height;
          }
          return {
            placements,
            width: maxUsedWidth,
            height: currentY + rowHeight,
          };
        }

        function packMaxRects(data) {
          if (typeof MaxRectsPacker === "undefined") {
            showToast(t("msgLibMissing"));
            return null;
          }

          const BIN_WIDTH = 4096;
          const BIN_HEIGHT = 4096;

          const packer = new MaxRectsPacker(BIN_WIDTH, BIN_HEIGHT, {
            smart: true,
            pot: false,
            square: false,
          });

          for (const item of data) {
            packer.add({
              width: item.width,
              height: item.height,
              data: item.index,
            });
          }

          let packedRects = packer.pack();

          if (!packedRects || packedRects.length < data.length) {
            packer.resize(4096, 8192);
            packedRects = packer.pack();
            if (!packedRects || packedRects.length < data.length) {
              showToast(
                "MaxRects couldn't fit all sprites in 4096x4096. Using Shelf.",
              );
              return null;
            } else {
              showToast(
                "Warning: Spritesheet height > 4096 (now 8192) may exceed some engine limits.",
              );
            }
          }

          const placements = [];
          let maxX = 0,
            maxY = 0;
          for (const rect of packedRects) {
            const idx = rect.data;
            const item = data[idx];
            placements.push({
              img: item.img,
              x: rect.x,
              y: rect.y,
              w: rect.width,
              h: rect.height,
              animName: item.animName,
              idx: item.index,
            });
            maxX = Math.max(maxX, rect.x + rect.width);
            maxY = Math.max(maxY, rect.y + rect.height);
          }

          placements.sort((a, b) => a.idx - b.idx);
          return { placements, width: maxX, height: maxY };
        }

        let packResult;
        if (algorithm === "maxrects") {
          packResult = packMaxRects(frameData);
          if (!packResult) packResult = packShelf(frameData);
        } else {
          packResult = packShelf(frameData);
        }

        const {
          placements,
          width: canvasWidth,
          height: canvasHeight,
        } = packResult;

        if (canvasHeight > 4096) {
          showToast(
            `Warning: Spritesheet is ${canvasHeight}px tall may exceed engine limits.`,
          );
        }

        const canvas = document.createElement("canvas");
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let xmlContent = `<?xml version="1.0" encoding="utf-8"?>\n<TextureAtlas imagePath="${sheetName}.png">\n`;
        const animCounters = {};

        for (const p of placements) {
          ctx.drawImage(p.img, p.x, p.y);
          const prefix = p.animName;
          if (!animCounters[prefix]) animCounters[prefix] = 0;
          const frameNum = String(animCounters[prefix]).padStart(4, "0");
          const subName = `${prefix}${frameNum}`;
          animCounters[prefix]++;

          xmlContent += `\t<SubTexture name="${subName}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" frameWidth="${p.w}" frameHeight="${p.h}" />\n`;
        }
        xmlContent += `</TextureAtlas>`;

        const zip = new JSZip();
        zip.file(`${sheetName}.xml`, xmlContent);

        canvas.toBlob(async (blob) => {
          if (!blob) {
            showToast("Error generating spritesheet image.");
            return;
          }
          zip.file(`${sheetName}.png`, blob);

          try {
            const zipBlob = await zip.generateAsync({ type: "blob" });
            const downloadLink = document.createElement("a");
            const url = URL.createObjectURL(zipBlob);
            downloadLink.href = url;
            downloadLink.download = `${sheetName}.zip`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            setTimeout(() => URL.revokeObjectURL(url), 100);
            showToast(t("msgSuccess"));
          } catch (error) {
            console.error(error);
            showToast("Error generating ZIP file.");
          }
        }, "image/png");
      }

      const dropzone = document.getElementById("dropzone");
      dropzone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.classList.add("dropzone-active");
      });
      dropzone.addEventListener("dragleave", (e) => {
        e.preventDefault();
        dropzone.classList.remove("dropzone-active");
      });
      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("dropzone-active");
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          processFiles(e.dataTransfer.files);
        }
      });

      function handleFileInput(event) {
        if (event.target.files && event.target.files.length > 0) {
          processFiles(event.target.files);
        }
        event.target.value = "";
      }

      document.addEventListener("DOMContentLoaded", () => {
        detectAndSetLanguage();
        setMode("sprite");
      });
    </script>
  </body>
</html>
